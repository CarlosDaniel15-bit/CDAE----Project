<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Padres - Escritorio</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="main-wrapper">
        <nav class="sidebar">
            <div class="logo-details">
                <i class='bx bxs-school'></i>
                <span class="logo_name">Control Escolar</span>
            </div>
            <ul class="nav-links">
                <li><a href="home.html" class="active"><i class='bx bx-home-alt'></i><span>Inicio</span></a></li>
                <li><a href="/Registro_alumno/Registro.html"><i class='bx bx-user-plus'></i><span>Registrar nuevo alumno</span></a></li>
                <li><a href="/Expedientes_alumnos/expedientes.html" class="active"><i class='bx bx-folder-open'></i><span>Expedientes</span></a></li>
                <li class="admin-only"><a href="#"><i class='bx bx-money'></i><span>Historial de Pagos</span></a></li> <!-- Comentarle al rpofe sobre lo de permisos de tutores y la mestra-->
                <li><a href="/Agenda_maestra/agenda.html"><i class='bx bx-calendar'></i><span>Agenda</span></a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="app-container">
                <header class="header">
                    <div class="saludo">
                        <h1>Familia Usuario</h1>
                        <p>Portal de Tutor</p>
                    </div>
                    <form action="/inicio_sesion/inicio.html">
                        <button class="btn-logout"><i class='bx bx-log-out'></i> Salir</button>
                    </form>
                </header>

                <div class="dashboard-grid">
                    
                    <div class="columna-principal">
                        <section class="info-hijo">
                            <div class="hijo-card">
                                <div class="info-texto">
                                    <h2>Carlos Villarreal</h2>
                                    <p><i class='bx bx-book-reader'></i> Nivel: 3ro de primaria</p>
                                </div>
                                <i class='bx bxs-user-rectangle icono-grande'></i>
                            </div>
                        </section>

                        <button class="btn-agendar" onclick="alert('Solicitud enviada')">
                            <i class='bx bx-plus-circle'></i> Solicitar nueva sesión
                        </button>
                    </div>

                    <div class="columna-secundaria">
                        <section class="proxima-clase">
                            <h3>Próxima Sesión</h3>
                            <div class="clase-card">
                                <div class="icono-fecha"><i class='bx bx-calendar-event'></i></div>
                                <div class="datos-clase">
                                    <h4>Jueves, 26 de Marzo</h4>
                                    <p>4:00 PM - 5:00 PM</p>
                                </div>
                            </div>
                        </section>

                        <section class="estado-pagos">
                            <h3>Estado de Cuenta</h3>
                            <div class="pago-card ok">
                                <i class='bx bx-check-shield'></i>
                                <div class="pago-detalles">
                                    <span class="titulo-pago">Mes de Marzo</span>
                                    <span class="estatus">Pagado y al corriente</span>
                                </div>
                            </div>
                        </section>
                    </div>
                    
                </div> </div>
        </main>
    </div>
</body>
</html>
