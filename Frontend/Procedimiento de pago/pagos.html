<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pagos</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="pagos.css">
</head>
<body>
    <div class="main-wrapper"> 
        
        <nav class="sidebar">
            <div class="logo-details">
                <i class='bx bxs-school'></i>
                <span class="logo_name">Control Escolar</span>
            </div>
            <ul class="nav-links">
                <li><a href="/Home_pagina/home.html"><i class='bx bx-home-alt'></i><span>Inicio</span></a></li>
                <li><a href="#"><i class='bx bx-group'></i><span>Registrar nuevo alumno</span></a></li>
                <li><a href="pagos.html" class="active"><i class='bx bx-money'></i><span>Historial de pagos</span></a></li>
                <li><a href="#"><i class='bx bx-calendar'></i><span>Agenda</span></a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="app-container">
                <header class="header">
                    <div class="titulo-nav">
                        <form action="/Home_pagina/home.html">
                            <button class="btn-back"><i class='bx bx-chevron-left'></i> Volver</button>
                        </form>
                        <h1>Control y Historial de Pagos</h1>
                    </div>
                    <p class="subtitulo">Consulta los ingresos del mes y el estado de cuenta de cada tutor.</p>
                </header>

                <div class="controles-superiores">
                    <div class="buscador">
                        <i class='bx bx-search'></i>
                        <input type="text" placeholder="Buscar alumno...">
                    </div>
                    
                    <div class="resumen-pagos">
                        <div class="caja-resumen ingresos">
                            <i class='bx bx-trending-up'></i>
                            <div>
                                <p>Ingresos (Marzo)</p>
                                <h3>$4,500</h3>
                            </div>
                        </div>
                        <div class="caja-resumen pendientes">
                            <i class='bx bx-error-circle'></i>
                            <div>
                                <p>Por cobrar</p>
                                <h3>2 Pendientes</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <section class="historial-lista">
                    <h2>Historial Reciente</h2>
                </section>
            </div> 
        </main>
    </div> </body>
</html>
